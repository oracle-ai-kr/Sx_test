# [S930] SX 자동매매 ① 신호 push — 실엔진 headless(오프라인 하네스 계보)를 스케줄/스냅커밋/수동으로 실행
#  결과: 신호원장 → Worker /sx/autotrade/signals (shared secret) → KV at:signals:{mkt} → sx_autotrade.html 점등
#  필요 시크릿: SX_WORKER_BASE, SX_AT_KEY (= Worker env AT_KEY 와 동일값)
#  필요 커밋파일: offline/at_signals_push.sh, offline/sx_offline_shim.js, offline/sig_runner_s927.js,
#                offline/snap_builder_s940.js,  # [S940] 스냅 자동갱신(런타임 네이버 fetch)
#                sx_analysis_engine.js, sx_project_c.js, sx_recipe_core.js, sx_verdict_val.js, snap_{kr,us,coin}.json
name: SX Autotrade Signals

on:
  schedule:
    # 평일 06:30 UTC = 15:30 KST (KR 장마감 후). [S940] 스냅은 실행 시 네이버서 최신 일봉으로 자동 리빌드(런타임).
    # ※ 스케줄은 GitHub 규칙상 "기본 브랜치"에서만 실행됨 → main = 검증본. [S946]
    - cron: '30 6 * * 1-5'
  push:
    # [S946] main 한정 — 실험 브랜치(recipe-lab)의 스냅 커밋이 신호를 밀지 않게. (기본 브랜치명이 다르면 여기 맞출 것)
    branches:
      - main
    # 스냅 갱신 커밋 시 즉시 재생성
    paths:
      - 'snap_kr.json'
      - 'snap_us.json'
      - 'snap_coin.json'
  workflow_dispatch: {}

concurrency:
  group: sx-autotrade-signals
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build engine + generate signals + push to KV
        env:
          WORKER_BASE: ${{ secrets.SX_WORKER_BASE }}
          AT_KEY: ${{ secrets.SX_AT_KEY }}
          SRC: .
          OFF_DIR: offline
        run: bash offline/at_signals_push.sh
